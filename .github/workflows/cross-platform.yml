name: Pruebas multiplataforma

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  router:
    name: Router · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnóstico del entorno
        run: python tools/agent_router/router.py doctor --json
      - name: Pruebas del router
        run: python -m unittest discover -s tools/agent_router -p test_router.py -v
      - name: Pruebas del puente
        run: python -m unittest discover -s tools/puente_agentes -p test_puente.py -v
      - name: Dry-run de sincronización y ciclo
        run: |
          python tools/agent_router/router.py sync --dry-run --json
          python tools/agent_router/router.py cycle --dry-run --json

  filepilot:
    name: FilePilot · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.x"]
    defaults:
      run:
        working-directory: projects/filepilot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias de desarrollo
        run: python -m pip install -e ".[dev]"
      - name: Ejecutar suite
        run: python -m pytest -q -rs
