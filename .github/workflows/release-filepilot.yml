name: Distribución de FilePilot

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags: ["v*.*.*"]
    paths:
      - ".github/workflows/release-filepilot.yml"
      - "LICENSE"
      - "projects/filepilot/**"
  pull_request:
    paths:
      - ".github/workflows/release-filepilot.yml"
      - "LICENSE"
      - "projects/filepilot/**"
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente que se debe construir y publicar
        required: true
        default: v0.1.0

env:
  FILEPILOT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: filepilot-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Ejecutable · Windows 10/11 x64
    runs-on: windows-2022
    defaults:
      run:
        working-directory: projects/filepilot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar herramientas aisladas de la aplicación
        run: python -m pip install -e ".[dev,release]"
      - name: Verificar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/release.py validar-version --tag "${{ env.FILEPILOT_TAG }}"
      - name: Ejecutar pruebas
        run: python -m pytest -q -rs
      - name: Construir ejecutable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --name filepilot
          --distpath "${{ runner.temp }}/filepilot-dist"
          --workpath "${{ runner.temp }}/filepilot-build"
          --specpath "${{ runner.temp }}/filepilot-spec"
          tools/filepilot_entry.py
      - name: Verificar y empaquetar
        run: |
          python tools/release.py verificar-ejecutable --ejecutable "${{ runner.temp }}/filepilot-dist/filepilot.exe"
          python tools/release.py empaquetar --plataforma windows --ejecutable "${{ runner.temp }}/filepilot-dist/filepilot.exe" --salida "${{ runner.temp }}/filepilot-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: filepilot-windows
          path: ${{ runner.temp }}/filepilot-assets/filepilot-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Ejecutable · Linux x86_64
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/filepilot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar herramientas aisladas de la aplicación
        run: python -m pip install -e ".[dev,release]"
      - name: Verificar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/release.py validar-version --tag "${{ env.FILEPILOT_TAG }}"
      - name: Ejecutar pruebas
        run: python -m pytest -q -rs
      - name: Construir ejecutable
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --name filepilot
          --distpath "${{ runner.temp }}/filepilot-dist"
          --workpath "${{ runner.temp }}/filepilot-build"
          --specpath "${{ runner.temp }}/filepilot-spec"
          tools/filepilot_entry.py
      - name: Verificar y empaquetar
        run: |
          python tools/release.py verificar-ejecutable --ejecutable "${{ runner.temp }}/filepilot-dist/filepilot"
          python tools/release.py empaquetar --plataforma linux --ejecutable "${{ runner.temp }}/filepilot-dist/filepilot" --salida "${{ runner.temp }}/filepilot-assets"
      - uses: actions/upload-artifact@v7
        with:
          name: filepilot-linux
          path: ${{ runner.temp }}/filepilot-assets/filepilot-v*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheel:
    name: Wheel · Python 3.11+
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/filepilot
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Instalar herramientas de construcción
        run: python -m pip install ".[dev,release]"
      - name: Verificar versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: python tools/release.py validar-version --tag "${{ env.FILEPILOT_TAG }}"
      - name: Construir y verificar wheel
        run: |
          version=$(python tools/release.py mostrar-version)
          wheel="${{ runner.temp }}/filepilot-wheel/filepilot-${version}-py3-none-any.whl"
          python -m build --wheel --no-isolation --outdir "${{ runner.temp }}/filepilot-wheel"
          python tools/release.py verificar-wheel --archivo "$wheel"
          python -m venv "${{ runner.temp }}/filepilot-clean"
          "${{ runner.temp }}/filepilot-clean/bin/python" -m pip install --no-deps "$wheel"
          cd "${{ runner.temp }}"
          "${{ runner.temp }}/filepilot-clean/bin/python" -m filepilot --help
          "${{ runner.temp }}/filepilot-clean/bin/filepilot" --help
      - uses: actions/upload-artifact@v7
        with:
          name: filepilot-wheel
          path: ${{ runner.temp }}/filepilot-wheel/filepilot-*-py3-none-any.whl
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar release verificada
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [windows, linux, wheel]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          pattern: filepilot-*
          merge-multiple: true
          path: release-assets
      - name: Validar entrega completa
        run: |
          version=$(python projects/filepilot/tools/release.py mostrar-version)
          python projects/filepilot/tools/release.py validar-version --tag "${{ env.FILEPILOT_TAG }}"
          python projects/filepilot/tools/release.py verificar-archivo --plataforma windows --archivo "release-assets/filepilot-v${version}-windows-x64.zip"
          python projects/filepilot/tools/release.py verificar-archivo --plataforma linux --archivo "release-assets/filepilot-v${version}-linux-x86_64.tar.gz"
          python projects/filepilot/tools/release.py verificar-wheel --archivo "release-assets/filepilot-${version}-py3-none-any.whl"
          python projects/filepilot/tools/release.py sumas --directorio release-assets
          python projects/filepilot/tools/release.py verificar-sumas --directorio release-assets
      - name: Crear borrador sin sobrescribir releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$FILEPILOT_TAG\") | .id" | head -n 1)
          if test -n "$existing"; then
            echo "Ya existe una release para $FILEPILOT_TAG"
            exit 1
          fi
          gh release create "$FILEPILOT_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "FilePilot $FILEPILOT_TAG"
      - name: Verificar y publicar el borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python projects/filepilot/tools/release.py mostrar-version)
          expected=$(printf '%s\n' \
            "SHA256SUMS.txt" \
            "filepilot-${version}-py3-none-any.whl" \
            "filepilot-v${version}-linux-x86_64.tar.gz" \
            "filepilot-v${version}-windows-x64.zip")
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$FILEPILOT_TAG\" and .draft == true) | .id" | head -n 1)
          test -n "$release_id"
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name' | sort)
          test "$actual" = "$expected"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
